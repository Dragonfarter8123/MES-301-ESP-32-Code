<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title description">
  <title id="title">MES 301 ESP32 wind-tunnel system wiring overview</title>
  <desc id="description">Wiring overview for the ESP32, ADS1115, DFR0997 display, DFR0971 DAC, existing ESP-10 and AD623 sensor chain, and a disconnected H-6910 controller.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .card-title { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .pin { font-size: 14px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 12; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .danger { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 10; }
      .sda { fill: none; stroke: #2563eb; stroke-width: 4; }
      .scl { fill: none; stroke: #16a34a; stroke-width: 4; }
      .lift { fill: none; stroke: #d97706; stroke-width: 3; }
      .drag { fill: none; stroke: #7c3aed; stroke-width: 3; }
      .ground { fill: none; stroke: #334155; stroke-width: 3; }
      .dacwire { fill: none; stroke: #7c3aed; stroke-width: 4; }
      .unsafe { fill: none; stroke: #e11d48; stroke-width: 4; stroke-dasharray: 10 8; }
      .label-sda { fill: #1d4ed8; }
      .label-scl { fill: #15803d; }
      .label-lift { fill: #b45309; }
      .label-drag { fill: #6d28d9; }
      .label-red { fill: #be123c; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1200" fill="#f1f5f9"/>
  <text x="40" y="52" class="title">MES 301 ESP32 Wind-Tunnel System</text>
  <text x="40" y="80" class="subtitle">Wiring overview based on the current firmware pin assignments and the existing sensor wiring</text>

  <rect x="40" y="98" width="1320" height="78" class="warn"/>
  <text x="62" y="128" class="body" font-weight="700">Before powering:</text>
  <text x="195" y="128" class="body">Verify module pin labels and I2C pull-up voltage. ESP32 GPIO signals must not be pulled up to 5 V.</text>
  <text x="62" y="153" class="body">Keep the DAC output disconnected from the H-6910 until its input range, polarity, common reference, enable, and safe-stop behavior are verified.</text>

  <!-- I2C shared bus wires, behind device cards -->
  <path d="M380 285 H425 V190 H875 V300 H910" class="sda"/>
  <path d="M380 325 H445 V208 H890 V338 H910" class="scl"/>
  <path d="M455 190 V355 H480" class="sda" marker-end="url(#arrow-blue)"/>
  <path d="M475 208 V390 H480" class="scl" marker-end="url(#arrow-green)"/>
  <path d="M875 300 H910" class="sda" marker-end="url(#arrow-blue)"/>
  <path d="M890 338 H910" class="scl" marker-end="url(#arrow-green)"/>

  <!-- DAC I2C bus -->
  <path d="M380 405 H405 V565 H875 V620 H910" class="dacwire" marker-end="url(#arrow-purple)"/>
  <path d="M380 445 H425 V585 H890 V658 H910" class="dacwire" marker-end="url(#arrow-purple)"/>

  <!-- Differential analog inputs -->
  <path d="M520 620 V560" class="lift" marker-end="url(#arrow-orange)"/>
  <path d="M570 620 V560" class="lift" marker-end="url(#arrow-orange)"/>
  <path d="M660 620 V560" class="drag" marker-end="url(#arrow-purple)"/>
  <path d="M710 620 V560" class="drag" marker-end="url(#arrow-purple)"/>

  <!-- ESP32 -->
  <rect x="40" y="210" width="340" height="500" class="card"/>
  <rect x="40" y="210" width="340" height="54" rx="12" fill="#dbeafe"/>
  <text x="62" y="245" class="card-title">ESP32 DevKit</text>
  <text x="65" y="292" class="body">GPIO21  SDA - shared bus</text>
  <text x="65" y="332" class="body">GPIO22  SCL - shared bus</text>
  <text x="65" y="412" class="body">GPIO26  SDA - DAC bus</text>
  <text x="65" y="452" class="body">GPIO27  SCL - DAC bus</text>
  <text x="65" y="512" class="body">3V3      ADS1115 supply</text>
  <text x="65" y="552" class="body">GND      common ground</text>
  <text x="65" y="622" class="small">GPIO21/22 are not changed.</text>
  <text x="65" y="646" class="small">GPIO26/27 are reserved for the DAC.</text>
  <text x="65" y="680" class="small">Power the ESP32 by its normal USB/input.</text>
  <circle cx="380" cy="285" r="5" fill="#2563eb"/>
  <circle cx="380" cy="325" r="5" fill="#16a34a"/>
  <circle cx="380" cy="405" r="5" fill="#7c3aed"/>
  <circle cx="380" cy="445" r="5" fill="#7c3aed"/>

  <!-- ADS1115 -->
  <rect x="480" y="220" width="360" height="340" class="card"/>
  <rect x="480" y="220" width="360" height="54" rx="12" fill="#dcfce7"/>
  <text x="502" y="255" class="card-title">ADS1115 ADC</text>
  <text x="502" y="300" class="body">I2C address: 0x48</text>
  <text x="502" y="330" class="body label-sda">SDA &lt;- GPIO21</text>
  <text x="502" y="365" class="body label-scl">SCL &lt;- GPIO22</text>
  <text x="502" y="405" class="body">VDD &lt;- ESP32 3V3</text>
  <text x="502" y="435" class="body">GND &lt;- common ground</text>
  <text x="502" y="478" class="small">Differential channels (firmware default):</text>
  <text x="502" y="505" class="small label-lift">A0 = lift amp +    A1 = lift amp -</text>
  <text x="502" y="532" class="small label-drag">A2 = drag amp +    A3 = drag amp -</text>
  <circle cx="480" cy="355" r="5" fill="#2563eb"/>
  <circle cx="480" cy="390" r="5" fill="#16a34a"/>
  <circle cx="520" cy="560" r="5" fill="#d97706"/>
  <circle cx="570" cy="560" r="5" fill="#d97706"/>
  <circle cx="660" cy="560" r="5" fill="#7c3aed"/>
  <circle cx="710" cy="560" r="5" fill="#7c3aed"/>

  <!-- Display -->
  <rect x="910" y="220" width="430" height="280" class="card"/>
  <rect x="910" y="220" width="430" height="54" rx="12" fill="#fef3c7"/>
  <text x="932" y="255" class="card-title">DFR0997 I2C Display</text>
  <text x="932" y="300" class="body">I2C address: 0x2C; shares ADS1115 bus</text>
  <text x="932" y="335" class="body label-sda">D / SDA &lt;- GPIO21</text>
  <text x="932" y="373" class="body label-scl">C / SCL &lt;- GPIO22</text>
  <text x="932" y="414" class="body">+ / VCC &lt;- 5 V supply, per module rating</text>
  <text x="932" y="450" class="body">- / GND &lt;- common ground</text>
  <text x="932" y="480" class="small">Check SDA/SCL pull-ups are ESP32-safe.</text>
  <circle cx="910" cy="300" r="5" fill="#2563eb"/>
  <circle cx="910" cy="338" r="5" fill="#16a34a"/>

  <!-- Existing sensor chain -->
  <rect x="480" y="620" width="360" height="250" class="card"/>
  <rect x="480" y="620" width="360" height="54" rx="12" fill="#ffedd5"/>
  <text x="502" y="655" class="card-title">Existing ESP-10 / AD623 chain</text>
  <text x="502" y="710" class="body">Lift ESP-10 -> AD623 -> ADS A0 (+), A1 (-)</text>
  <text x="502" y="750" class="body">Drag ESP-10 -> AD623 -> ADS A2 (+), A3 (-)</text>
  <text x="502" y="800" class="small">Keep the already-verified sensor excitation,</text>
  <text x="502" y="822" class="small">AD623 gain/reference, and amplifier power wiring.</text>
  <text x="502" y="846" class="small">Do not exceed the ADS1115 input/common-mode limits.</text>
  <circle cx="520" cy="620" r="5" fill="#d97706"/>
  <circle cx="570" cy="620" r="5" fill="#d97706"/>
  <circle cx="660" cy="620" r="5" fill="#7c3aed"/>
  <circle cx="710" cy="620" r="5" fill="#7c3aed"/>

  <!-- DAC -->
  <rect x="910" y="550" width="430" height="320" class="card"/>
  <rect x="910" y="550" width="430" height="54" rx="12" fill="#ede9fe"/>
  <text x="932" y="585" class="card-title">DFRobot DFR0971 DAC</text>
  <text x="932" y="628" class="body">I2C address: 0x5F; output channel: VOUT0</text>
  <text x="932" y="665" class="body label-drag">SDA &lt;- GPIO26    SCL &lt;- GPIO27</text>
  <text x="932" y="705" class="body">+ / VCC &lt;- external regulated +5 V</text>
  <text x="932" y="742" class="body">- / GND &lt;- common ground with ESP32</text>
  <text x="932" y="784" class="body">VOUT0 = analog command output; VOUT1 unused</text>
  <text x="932" y="824" class="small">Never connect VOUT0/VOUT1 to ESP32 GPIO or ADS1115.</text>
  <circle cx="910" cy="620" r="5" fill="#7c3aed"/>
  <circle cx="910" cy="658" r="5" fill="#7c3aed"/>

  <!-- Power/common ground notes -->
  <rect x="40" y="750" width="340" height="250" class="card"/>
  <rect x="40" y="750" width="340" height="54" rx="12" fill="#e2e8f0"/>
  <text x="62" y="785" class="card-title">Power and ground</text>
  <text x="62" y="835" class="body">ADS1115 VDD: ESP32 3V3</text>
  <text x="62" y="870" class="body">Display +: 5 V, per module rating</text>
  <text x="62" y="905" class="body">DAC +: external regulated +5 V</text>
  <text x="62" y="940" class="body">Tie ESP32, ADS, display, DAC, and</text>
  <text x="62" y="966" class="body">sensor-amplifier grounds together.</text>
  <text x="62" y="990" class="small">Do not power the DAC VCC from an ESP32 GPIO.</text>

  <!-- H-6910 safety boundary -->
  <path d="M1125 870 V925" class="unsafe"/>
  <line x1="1108" y1="895" x2="1142" y2="895" stroke="#e11d48" stroke-width="6"/>
  <rect x="910" y="925" width="430" height="120" class="danger"/>
  <text x="932" y="960" class="card-title label-red">H-6910: leave disconnected</text>
  <text x="932" y="990" class="small">Do not wire VOUT0 to the controller until its input</text>
  <text x="932" y="1014" class="small">specification and independent safe-stop are verified.</text>

  <!-- Signal-level warning and legend -->
  <rect x="420" y="925" width="430" height="120" class="warn"/>
  <text x="442" y="960" class="card-title">I2C voltage-level check</text>
  <text x="442" y="990" class="small">If a 5 V-powered module pulls SDA/SCL to 5 V, add a</text>
  <text x="442" y="1014" class="small">bidirectional I2C level shifter before connecting GPIOs.</text>

  <rect x="40" y="1065" width="1320" height="92" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <text x="62" y="1098" class="body" font-weight="700">Wire colors:</text>
  <line x1="165" y1="1093" x2="210" y2="1093" class="sda"/><text x="220" y="1098" class="small">shared SDA</text>
  <line x1="330" y1="1093" x2="375" y2="1093" class="scl"/><text x="385" y="1098" class="small">shared SCL</text>
  <line x1="495" y1="1093" x2="540" y2="1093" class="dacwire"/><text x="550" y="1098" class="small">DAC SDA/SCL</text>
  <line x1="680" y1="1093" x2="725" y2="1093" class="lift"/><text x="735" y="1098" class="small">lift pair</text>
  <line x1="835" y1="1093" x2="880" y2="1093" class="drag"/><text x="890" y="1098" class="small">drag pair</text>
  <line x1="990" y1="1093" x2="1035" y2="1093" class="unsafe"/><text x="1045" y="1098" class="small">do not connect yet</text>
  <text x="62" y="1132" class="small">Overview only: use the exact silk-screen pin names on your ESP32 and modules. This drawing does not define the sensor excitation or AD623 component values.</text>
</svg>
